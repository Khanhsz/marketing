services:
  - type: web
    name: market-research-ai-lab
    runtime: python
    plan: free
    region: singapore
    branch: market-research-ai-lab
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address=0.0.0.0 --server.port=$PORT --server.headless=true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
